name: Companion Outreach Heartbeat

on:
  schedule:
    # Offset from the top of the hour to reduce GitHub scheduler congestion.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: companion-outreach-heartbeat
  cancel-in-progress: false

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request short-lived GitHub OIDC identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mythic-life-outreach" \
            | jq -r '.value')"
          test -n "$token"
          test "$token" != "null"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Run companion outreach heartbeat
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --location \
            --max-redirs 0 \
            --retry 2 \
            --retry-delay 3 \
            --max-time 75 \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "User-Agent: mythic-life-github-outreach" \
            "https://mythic-life-bice.vercel.app/api/cron/outreach")"

          echo "$response" | jq -e '.ok == true and .privileged == true' >/dev/null
          echo "$response"
