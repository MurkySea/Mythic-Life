name: Apply Seraphine runtime wiring

on:
  push:
    branches:
      - feat/seraphine-cognitive-loop

permissions:
  contents: write

jobs:
  patch-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/seraphine-cognitive-loop
          fetch-depth: 0

      - name: Patch app/actions.ts
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/actions.ts')
          text = path.read_text()

          import_anchor = """import {
            maybeCaptureMemory,
            loadBestMemories,
            maybeRecordAbsence,
            companionPrivateFocus,
            curiosityWhenThin,
          } from '@/lib/memory'
          """
          import_block = import_anchor + """import {
            buildCompanionRewritePrompt,
            generateCompanionWithQualityLoop,
            runCharacterEngine,
            type CompanionDraftContext,
          } from '@/lib/character-engine'
          """

          if "generateCompanionWithQualityLoop" not in text:
              if import_anchor not in text:
                  raise SystemExit('memory import anchor not found')
              text = text.replace(import_anchor, import_block, 1)

          old = """  const temperature = 0.88 + Math.random() * 0.12

            try {
              const response = await fetch('https://api.x.ai/v1/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  Authorization: `Bearer ${process.env.GROK_API_KEY}`,
                },
                body: JSON.stringify({
                  model: 'grok-4',
                  messages: [
                    { role: 'system', content: systemRules },
                    { role: 'user', content: userPrompt },
                  ],
                  temperature,
                  max_tokens: maxTokens,
                }),
              })

              const data = await response.json()
              let message =
                data.choices?.[0]?.message?.content?.trim() || `Still here.`

              message = message
                .replace(/^[\"']|[\"']$/g, '')
                .replace(new RegExp(`^${displayName}\\\\s*:\\\\s*`, 'i'), '')
                .replace(/^\\\\*[^*]+\\\\*\\\\s*/g, '')
                .trim()

              await supabase.from('messages').insert({
                role: 'companion',
                content: message,
                companion_slug: companionSlug,
              })

              await savePersistedMood(companion?.id, mood)

              return message
            } catch (error) {
              console.error('Grok API error:', error)
              const fallback = `I'm still here.`
              await supabase.from('messages').insert({
                role: 'companion',
                content: fallback,
                companion_slug: companionSlug,
              })
              return fallback
            }
          """

          new = """  const temperature = 0.88 + Math.random() * 0.12

            const sanitizeReply = (value: string) =>
              String(value || '')
                .trim()
                .replace(/^[\"']|[\"']$/g, '')
                .replace(new RegExp(`^${displayName}\\\\s*:\\\\s*`, 'i'), '')
                .replace(/^\\\\*[^*]+\\\\*\\\\s*/g, '')
                .trim()

            const requestDraft = async (context?: CompanionDraftContext): Promise<string> => {
              const rewritePrompt = context ? buildCompanionRewritePrompt(context) : ''
              const response = await fetch('https://api.x.ai/v1/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  Authorization: `Bearer ${process.env.GROK_API_KEY}`,
                },
                body: JSON.stringify({
                  model: 'grok-4',
                  messages: [
                    { role: 'system', content: systemRules },
                    {
                      role: 'user',
                      content: rewritePrompt ? `${userPrompt}\\n\\n${rewritePrompt}` : userPrompt,
                    },
                  ],
                  temperature: context && context.attempt > 1 ? 0.72 : temperature,
                  max_tokens: maxTokens,
                }),
              })

              if (!response.ok) {
                throw new Error(`Grok API returned ${response.status}`)
              }

              const data = await response.json()
              return sanitizeReply(data.choices?.[0]?.message?.content || '')
            }

            try {
              let message: string

              if (isConversation) {
                const engine = runCharacterEngine({
                  companionSlug,
                  userText: taskTitle,
                  affinity,
                  hour: localHourChicago(),
                  recentHistory: historyBlock,
                  def,
                })

                const result = await generateCompanionWithQualityLoop({
                  direction: engine.direction,
                  maxAttempts: 3,
                  generate: requestDraft,
                })

                message = sanitizeReply(result.reply)

                if (result.attempts > 1) {
                  console.info('Companion reply rewritten by quality loop', {
                    companionSlug,
                    attempts: result.attempts,
                    score: result.quality.score,
                  })
                }
              } else {
                message = (await requestDraft()) || `I noticed.`
              }

              await supabase.from('messages').insert({
                role: 'companion',
                content: message,
                companion_slug: companionSlug,
              })

              await savePersistedMood(companion?.id, mood)

              return message
            } catch (error) {
              console.error('Grok API error:', error)
              const fallback = isConversation
                ? `I don't want to answer you with something empty. Tell me what feels most important in this moment.`
                : `I noticed.`
              await supabase.from('messages').insert({
                role: 'companion',
                content: fallback,
                companion_slug: companionSlug,
              })
              return fallback
            }
          """

          if "const requestDraft = async" not in text:
              if old not in text:
                  raise SystemExit('generation block anchor not found')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Install and test
        run: |
          npm ci
          npm test -- --run

      - name: Commit runtime wiring
        run: |
          if git diff --quiet; then
            echo "No runtime changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/actions.ts
          git commit -m "feat: enforce companion quality loop in live generation"
          git push origin HEAD:feat/seraphine-cognitive-loop
